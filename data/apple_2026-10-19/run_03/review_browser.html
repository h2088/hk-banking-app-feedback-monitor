8T02:34:07+08:00", "review_time_utc": "2023-10-27T18:34:07+00:00", "source_updated_time": "2023-10-27T11:34:07-07:00", "review_timestamp_seconds": 1698431647.0, "title": "I like it", "text": "It is user friendly and easy to use", "rating": 5, "user_display_name": "Peggybebe", "review_app_version": "6.32.0", "vote_sum": 0, "vote_count": 0, "developer_reply": null, "reply_availability": "not_exposed_by_public_rss", "detected_language": "en", "language_status": "english", "language_method": "langdetect_1.0.9_seed_0", "language_probabilities": {"en": 0.999997}, "within_six_month_window": false, "on_or_before_cutoff": true, "source_url": "https://apps.apple.com/hk/app/sc-mobile-hong-kong/id445795688?l=en-GB&see-all=reviews&platform=iphone", "feed_review_url": "https://itunes.apple.com/hk/review?id=445795688&l=en&type=Purple%20Software", "collected_at_utc": "2026-10-19T08:30:17.315079+00:00", "raw_response_file": "sc_mobile/raw/page_10_variant6.body", "raw_entry_index": 39}, {"source": "Apple App Store RSS", "storefront": "hk", "app": "SC Mobile Hong Kong", "app_id": "445795688", "review_id": "10490456719", "review_time_hk": "2023-10-19T11:03:13+08:00", "review_time_utc": "2023-10-19T03:03:13+00:00", "source_updated_time": "2023-10-18T20:03:13-07:00", "review_timestamp_seconds": 1697684593.0, "title": "Unfortunate UX Design from a banking app", "text": "I use “unfortunate” instead of “unfriendly” because it simply doesn’t consider user experience at all so there is no friendliness to speak of. This came from some of my years using the app:\n\n- accounts disappeared after phone change and app reinstalled. It will just show the account you used to reinstall app, all other accounts must be added back (no, not all banks do that, HxBC does it seamlessly)\n\n- ID card capture is a joke (again, if above has been fixed we will not have this request). Please ask your testing team to try before release. I doubt any normal human beings can get it done in 30 mins for front and back scans of the ID card.\n\n- advertisements before login page. Yes, forced advertisement every time before you can login. Bank: this is genius! Customers: if so, let’s cut out your relationship manager?\n\n- if pre-login advertisement page down, you can even go on to login.\n\n- “continue” button placed at the edge of app browser and my iPhone 14, 15 both face the problem of no response.\n\n- transfer amount input looks like it’s for web (but I see it in my app), which requires a lot of tapping to trigger the amount input.\n\nDare I say more? Yes, your banking app is severely lagging behinds your peers. Up your game or out!", "rating": 1, "user_display_name": "McCreamy", "review_app_version": "6.31.5", "vote_sum": 3, "vote_count": 3, "developer_reply": null, "reply_availability": "not_exposed_by_public_rss", "detected_language": "en", "language_status": "english", "language_method": "langdetect_1.0.9_seed_0", "language_probabilities": {"en": 0.999996}, "within_six_month_window": false, "on_or_before_cutoff": true, "source_url": "https://apps.apple.com/hk/app/sc-mobile-hong-kong/id445795688?l=en-GB&see-all=reviews&platform=iphone", "feed_review_url": "https://itunes.apple.com/hk/review?id=445795688&l=en&type=Purple%20Software", "collected_at_utc": "2026-10-19T08:30:17.315079+00:00", "raw_response_file": "sc_mobile/raw/page_10_variant6.body", "raw_entry_index": 41}, {"source": "Apple App Store RSS", "storefront": "hk", "app": "SC Mobile Hong Kong", "app_id": "445795688", "review_id": "10442332987", "review_time_hk": "2023-10-06T02:03:26+08:00", "review_time_utc": "2023-10-05T18:03:26+00:00", "source_updated_time": "2023-10-05T11:03:26-07:00", "review_timestamp_seconds": 1696529006.0, "title": "Apparently this is an app that gets 4.6- stars", "text": "UI is old at best, buggy at times, the “Add to Apple Wallet” button for the credit card just doesn’t work 98% of the time (iPhone 13). Struggled to even tap the bloody button.\n\nWorst part is the UX regarding how much I actually owe the bank, when I have to figure out how much I actually need to pay\n\nWhy not just show us the amount that we actually owe? Why bother showing us a total of out billed and unbilled transactions? It doesn’t make any sense from a UX perspective. All users want to know is how much they’ve spent this month, and how much we actually need to pay the bank back. Simple. \n\nHonestly I don’t even know how much I actually need to pay, so I either end up paying more or paying less than the amount. I don’t want to split my payments by following the “minimum amount due”. Just give me the full amount of how much I owe this month. Right? \n\nPlease fix this. I expect better from a bank like Standard Chartered.", "rating": 1, "user_display_name": "ARandomDev", "review_app_version": "6.31.5", "vote_sum": 0, "vote_count": 0, "developer_reply": null, "reply_availability": "not_exposed_by_public_rss", "detected_language": "en", "language_status": "english", "language_method": "langdetect_1.0.9_seed_0", "language_probabilities": {"en": 0.999997}, "within_six_month_window": false, "on_or_before_cutoff": true, "source_url": "https://apps.apple.com/hk/app/sc-mobile-hong-kong/id445795688?l=en-GB&see-all=reviews&platform=iphone", "feed_review_url": "https://itunes.apple.com/hk/review?id=445795688&l=en&type=Purple%20Software", "collected_at_utc": "2026-10-19T08:30:17.315079+00:00", "raw_response_file": "sc_mobile/raw/page_10_variant6.body", "raw_entry_index": 43}, {"source": "Apple App Store RSS", "storefront": "hk", "app": "SC Mobile Hong Kong", "app_id": "445795688", "review_id": "10439931901", "review_time_hk": "2023-10-05T11:14:58+08:00", "review_time_utc": "2023-10-05T03:14:58+00:00", "source_updated_time": "2023-10-04T20:14:58-07:00", "review_timestamp_seconds": 1696475698.0, "title": "User unfriendly", "text": "The apps is user unfriendly compared to mobile apps of other banks. It always takes time to find the suitable function inside. And almost every time I log in, I need
